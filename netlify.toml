# Netlify serves the app straight from /public. The only build step runs the server and rules tests, so a deploy
# with a failing test stops here and the live site stays as it was. (Browser tests run in GitHub Actions.)
[build]
  publish = "public"
  command = "npm test"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
    Cache-Control = "no-cache"
