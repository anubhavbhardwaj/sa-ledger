<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Test museum tickets</title></head><body>
<app-root>
  <header><nav><a href="#">Tickets</a> <a href="#">FAQ</a> <a href="#">Contacts</a></nav></header>
  <main>
    <p><b>This ticket is non-transferable. To enter, you will have to show official photo ID.</b></p>
    <div class="ticket"><p class="ticket-type"><b>General</b></p>
      <div class="mat-form-field"><label for="mat-input-0"><span>Name</span><span aria-hidden="true"> *</span></label><input id="mat-input-0" required></div>
      <div class="mat-form-field"><label for="mat-input-1"><span>Surname</span><span aria-hidden="true"> *</span></label><input id="mat-input-1" required></div>
      <div class="mat-form-field"><label for="mat-input-2">Document type *</label><input id="mat-input-2" readonly value="Pasaporte"></div>
      <div class="mat-form-field"><span>Issued by *</span><div role="combobox" tabindex="0">Others</div></div>
      <div class="mat-form-field"><label for="mat-input-3">Passport document number Other *</label><input id="mat-input-3" required></div>
    </div>
    <div class="ticket"><p class="ticket-type"><b>General 2</b></p>
      <div class="mat-form-field"><label for="mat-input-4"><span>Name</span><span aria-hidden="true"> *</span></label><input id="mat-input-4" required></div>
      <div class="mat-form-field"><label for="mat-input-5"><span>Surname</span><span aria-hidden="true"> *</span></label><input id="mat-input-5" required></div>
      <div class="mat-form-field"><label for="mat-input-6">Document type *</label><input id="mat-input-6" readonly value="Pasaporte"></div>
      <div class="mat-form-field"><span>Issued by *</span><div role="combobox" tabindex="0">Others</div></div>
      <div class="mat-form-field"><label for="mat-input-7">Passport document number Other *</label><input id="mat-input-7" required></div>
    </div>
  </main>
</app-root>
</body></html>
